<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dovehero CRM — Revenue Command Deck</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root{
  --bg:#080B1A; --bg-2:#0A0F24;
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075); --glass-3:rgba(255,255,255,.11);
  --stroke:rgba(150,170,255,.14); --stroke-2:rgba(150,170,255,.26); --stroke-3:rgba(150,170,255,.4);
  --ink:#EAEDFF; --sub:#9aa3cf; --faint:#5f6796; --dim:#454c75;
  --violet:#8E7CFF; --blue:#4F8BFF; --cyan:#33E1E6; --mag:#FF63B0; --gold:#FFC24B; --green:#36E2A0; --rose:#FF6B81;
  --grad:linear-gradient(135deg,#5B7CFF 0%,#9B6BFF 52%,#33E1E6 100%);
  --grad-warm:linear-gradient(135deg,#FF63B0,#FFB14B);
  --glow:0 10px 34px -10px rgba(99,124,255,.55);
  --glow-strong:0 18px 60px -14px rgba(120,110,255,.7);
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:16px; --r-sm:11px; --r-lg:22px;
  --sp:cubic-bezier(.34,1.45,.5,1); --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;
  font-feature-settings:"cv02","cv03","cv04","ss01";
}
/* ambient aurora */
.aurora{position:fixed;inset:-20% -10% -10% -10%;z-index:0;pointer-events:none;filter:blur(40px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:48vw;height:48vw;left:-8vw;top:-12vw;background:radial-gradient(circle,#3a51c8,transparent 62%);animation:drift1 26s var(--ease) infinite alternate}
.aurora i:nth-child(2){width:42vw;height:42vw;right:-6vw;top:-6vw;background:radial-gradient(circle,#7a3fd0,transparent 62%);animation:drift2 31s var(--ease) infinite alternate}
.aurora i:nth-child(3){width:40vw;height:40vw;left:30vw;bottom:-18vw;background:radial-gradient(circle,#1f8ab0,transparent 62%);animation:drift3 35s var(--ease) infinite alternate}
.aurora i:nth-child(4){width:26vw;height:26vw;right:18vw;bottom:-10vw;background:radial-gradient(circle,#c43f86,transparent 64%);opacity:.7;animation:drift1 29s var(--ease) infinite alternate-reverse}
@keyframes drift1{to{transform:translate(6vw,5vh) scale(1.12)}}
@keyframes drift2{to{transform:translate(-5vw,7vh) scale(1.08)}}
@keyframes drift3{to{transform:translate(4vw,-6vh) scale(1.15)}}

#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}
::selection{background:rgba(142,124,255,.34)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(150,170,255,.16);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(150,170,255,.3);background-clip:padding-box}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

/* ---------------- top bar ---------------- */
.top{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--stroke);
  background:linear-gradient(180deg,rgba(14,19,42,.7),rgba(10,15,36,.4));backdrop-filter:blur(18px);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow);position:relative;overflow:hidden}
.brand .mark::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.6),transparent 50%)}
.brand .mark svg{position:relative;z-index:1}
.brand small{font-family:var(--body);font-weight:500;color:var(--faint);font-size:11px;letter-spacing:.04em;margin-left:2px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px}
.crumb b{color:var(--ink);font-weight:600}

.seg{display:flex;gap:3px;padding:3px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.seg button{font:inherit;font-size:12.5px;font-weight:600;color:var(--sub);background:none;border:none;padding:7px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.2s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{color:#fff;background:var(--glass-3);box-shadow:0 2px 12px -4px rgba(120,124,255,.5);position:relative}
.seg button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;background:var(--grad)}

.search{flex:1;max-width:380px;display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);transition:.2s var(--ease)}
.search:focus-within{border-color:var(--stroke-3);box-shadow:0 0 0 4px rgba(99,124,255,.12)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:13px}
.search input::placeholder{color:var(--faint)}
.search kbd{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--stroke);border-radius:5px;padding:2px 5px}

.btn{font:inherit;font-size:13px;font-weight:600;border-radius:11px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--stroke);background:var(--glass-2);color:var(--ink);transition:.18s var(--ease);white-space:nowrap}
.btn:hover{background:var(--glass-3);border-color:var(--stroke-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{box-shadow:var(--glow-strong);filter:brightness(1.06)}
.btn.ai{background:linear-gradient(135deg,rgba(142,124,255,.22),rgba(51,225,230,.16));border-color:rgba(142,124,255,.4);color:#dfe2ff}
.btn.ai:hover{border-color:rgba(142,124,255,.7);box-shadow:0 0 22px -6px rgba(142,124,255,.6)}
.icobtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--stroke);background:var(--glass);color:var(--sub);cursor:pointer;transition:.18s var(--ease);position:relative}
.icobtn:hover{color:var(--ink);border-color:var(--stroke-2);background:var(--glass-2)}
.dot-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--grad-warm);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--display);color:#fff;flex:none;font-size:11px}

/* ---------------- board ---------------- */
.boardwrap{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.board-bar{display:flex;align-items:center;gap:12px;padding:14px 20px 6px;flex:none}
.board-bar .stat{display:flex;align-items:baseline;gap:8px}
.board-bar .stat .big{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.board-bar .stat .lbl{color:var(--sub);font-size:12.5px}
.spark{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--faint);font-size:11.5px}
.board{flex:1;display:flex;gap:16px;padding:10px 20px 22px;overflow-x:auto;overflow-y:hidden;min-height:0;scroll-snap-type:x proximity}
.col{flex:0 0 312px;display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--stroke);
  min-height:0;scroll-snap-align:start;transition:box-shadow .25s var(--ease),border-color .25s var(--ease),transform .25s var(--sp);position:relative;overflow:hidden}
.col::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ch,var(--grad));opacity:.85}
.col.hot{border-color:var(--ch);box-shadow:0 0 0 1px var(--ch), 0 18px 50px -18px var(--ch);transform:translateY(-3px)}
.col.hot::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--ch) 16%,transparent),transparent 70%);pointer-events:none;animation:intake 1.1s var(--ease) infinite}
@keyframes intake{0%,100%{opacity:.5}50%{opacity:1}}
.col-head{display:flex;align-items:center;gap:9px;padding:14px 15px 10px;flex:none}
.col-head .cdot{width:9px;height:9px;border-radius:50%;background:var(--ch);box-shadow:0 0 12px var(--ch);flex:none}
.col-head .cname{font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.01em}
.col-head .ccount{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:7px;padding:2px 7px}
.col-head .ctotal{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink)}
.ring{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ch) calc(var(--p,0)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0c1126}
.ring b{position:relative;font-family:var(--mono);font-size:8.5px;font-weight:700;color:var(--ch)}
.col-cards{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 12px;display:flex;flex-direction:column;gap:11px;min-height:40px}
.col-foot{flex:none;padding:8px 12px 13px}
.addcard{width:100%;border:1px dashed var(--stroke-2);background:none;color:var(--sub);border-radius:12px;padding:9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.18s var(--ease)}
.addcard:hover{border-color:var(--ch);color:var(--ink);background:color-mix(in srgb,var(--ch) 8%,transparent)}

.kcard{position:relative;border-radius:var(--r);padding:13px 13px 12px 16px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035));
  border:1px solid var(--stroke);cursor:grab;transition:transform .2s var(--sp),box-shadow .2s var(--ease),border-color .2s var(--ease);
  will-change:transform;transform-style:preserve-3d}
.kcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--ch);box-shadow:0 0 10px var(--ch)}
.kcard:hover{border-color:var(--stroke-2);box-shadow:0 14px 34px -16px rgba(0,0,0,.6),0 0 0 1px var(--stroke-2)}
.kcard:active{cursor:grabbing}
.kcard.flash{animation:flash .7s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--ch),0 0 40px -4px var(--ch)}100%{box-shadow:0 14px 34px -16px rgba(0,0,0,.6)}}
.kc-top{display:flex;align-items:flex-start;gap:8px}
.kc-name{font-weight:600;font-size:13.5px;line-height:1.3;letter-spacing:-.01em;flex:1;min-width:0}
.kc-co{font-size:11.5px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:5px}
.peek{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;border:1px solid transparent;background:rgba(255,255,255,.05);color:var(--faint);cursor:pointer;opacity:0;transition:.16s var(--ease);flex:none}
.kcard:hover .peek{opacity:1}
.peek:hover{color:var(--ink);border-color:var(--stroke-2);background:var(--glass-3);transform:scale(1.08)}
.kc-mid{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.kc-val{font-family:var(--mono);font-weight:700;font-size:15px}
.kc-val.zero{color:var(--faint)}
.hgauge{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700}
.hgauge .bar{width:34px;height:5px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.hgauge .bar i{display:block;height:100%;border-radius:4px}
.kc-foot{display:flex;align-items:center;gap:6px;margin-top:11px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--sub)}
.tag.warn{background:rgba(255,107,129,.12);border-color:rgba(255,107,129,.35);color:#ff97a6}
.kc-owner{margin-left:auto;display:flex;align-items:center;gap:6px}
.prio{width:7px;height:7px;border-radius:50%;flex:none}
.prio.high{background:var(--rose);box-shadow:0 0 8px var(--rose)}
.prio.med{background:var(--gold)}
.prio.low{background:var(--dim)}

.placeholder{border-radius:var(--r);border:1.5px dashed var(--ch);background:color-mix(in srgb,var(--ch) 10%,transparent);
  box-shadow:inset 0 0 26px -6px var(--ch);position:relative;animation:phpulse 1.3s var(--ease) infinite}
.placeholder::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;transform:translateY(-50%);background:var(--ch);box-shadow:0 0 14px var(--ch);border-radius:2px;opacity:.9}
@keyframes phpulse{0%,100%{opacity:.7}50%{opacity:1}}
.ghost{border-radius:var(--r);box-shadow:0 30px 70px -18px rgba(0,0,0,.7),0 0 0 1px var(--ch),0 0 50px -8px var(--ch)!important;
  background:linear-gradient(180deg,rgba(28,34,68,.96),rgba(20,26,54,.96))!important;backdrop-filter:blur(10px);opacity:.96}
body.dragging{cursor:grabbing}
body.dragging *{cursor:grabbing!important}
body.dragging .col-cards{scroll-behavior:smooth}

/* drag prediction tooltip */
.predict{position:fixed;z-index:1000;pointer-events:none;font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;border-radius:9px;
  background:rgba(12,17,38,.92);border:1px solid var(--ch);color:var(--ch);box-shadow:0 0 20px -4px var(--ch);transform:translate(-50%,-140%);white-space:nowrap}

/* ---------------- list / spreadsheet ---------------- */
.listwrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 20px 0}
.ltable{flex:1;border-radius:var(--r);border:1px solid var(--stroke);background:var(--glass);overflow:auto;min-height:0;position:relative}
.lhead{display:flex;position:sticky;top:0;z-index:5;background:rgba(13,18,40,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke-2)}
.lh{position:relative;padding:11px 13px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:6px;flex:none;user-select:none}
.lh .sortx{cursor:pointer}
.lh .resizer{position:absolute;right:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:2}
.lh .resizer::after{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--stroke-2);transition:.15s}
.lh .resizer:hover::after,.lh .resizer.act::after{background:var(--blue);box-shadow:0 0 8px var(--blue);width:2px}
.lrow{display:flex;border-bottom:1px solid rgba(150,170,255,.07);transition:background .12s}
.lrow:hover{background:rgba(255,255,255,.035)}
.lcell{padding:9px 13px;font-size:13px;flex:none;display:flex;align-items:center;gap:7px;min-width:0;position:relative;border-right:1px solid transparent;overflow:hidden}
.lcell.num{font-family:var(--mono);font-weight:600}
.lcell .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcell.edit{cursor:text}
.lcell.sel{border:1.5px solid var(--blue);box-shadow:inset 0 0 0 1px rgba(79,139,255,.4),0 0 14px -4px var(--blue);border-radius:5px;background:rgba(79,139,255,.08);z-index:3}
.fillh{position:absolute;right:-4px;bottom:-4px;width:9px;height:9px;border-radius:2px;background:var(--blue);border:1.5px solid #0c1126;cursor:crosshair;z-index:4;box-shadow:0 0 8px var(--blue)}
.lcell.filltarget{background:rgba(79,139,255,.14);box-shadow:inset 0 0 0 1px rgba(79,139,255,.3)}
.cellin{position:absolute;inset:2px;background:#0e1430;border:1.5px solid var(--blue);border-radius:5px;color:var(--ink);font:inherit;font-size:13px;padding:0 9px;outline:none;z-index:6;box-shadow:0 0 0 3px rgba(79,139,255,.18)}
select.cellin{padding:0 6px}
.lrow .ltools{position:sticky;right:0;margin-left:auto;display:flex;gap:4px;align-items:center;padding:0 10px;background:linear-gradient(90deg,transparent,rgba(13,18,40,.95) 30%);opacity:0;transition:.15s}
.lrow:hover .ltools{opacity:1}
.ltools button{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:rgba(255,255,255,.05);color:var(--faint);cursor:pointer;display:grid;place-items:center}
.ltools button:hover{color:var(--ink);border-color:var(--stroke-2)}
.lfoot{flex:none;display:flex;align-items:center;gap:18px;padding:11px 6px;color:var(--sub);font-size:12px}
.lfoot b{color:var(--ink);font-family:var(--mono)}

/* ===== list view enhancements ===== */
.listwrap.dens-compact .lcell{padding:4px 13px;font-size:12.5px}
.listwrap.dens-compact .lh{padding:8px 13px}

.ltoolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 12px}
.ltw{position:relative}
.ltb{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1px solid var(--stroke-2);background:var(--glass-2);color:var(--sub);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.ltb:hover{color:var(--ink);border-color:var(--stroke)}
.ltb.on{color:var(--ink);border-color:var(--violet);background:rgba(142,124,255,.14);box-shadow:0 0 0 1px rgba(142,124,255,.3)}
.ltb b{font-family:var(--mono);font-size:11px;background:var(--violet);color:#fff;padding:0 6px;border-radius:7px;font-weight:700}
.ltb-res{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--faint);font-size:12px}
.ltb-res b{color:var(--ink);font-family:var(--mono)}
.lt-scrim{position:fixed;inset:0;z-index:38}
.lt-menu{position:absolute;top:calc(100%+6px);left:0;z-index:42;min-width:194px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--stroke);border-radius:13px;padding:6px;box-shadow:0 24px 60px -18px rgba(0,0,0,.7)}
.lt-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:0;background:none;color:var(--sub);font-size:12.5px;cursor:pointer}
.lt-i:hover{background:var(--glass-3);color:var(--ink)}
.lt-i.on{color:var(--ink)}
.gd{width:8px;height:8px;border-radius:50%;display:inline-block}

.cp-menu{position:absolute;top:calc(100%+6px);left:0;z-index:42;width:270px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--stroke);border-radius:14px;padding:12px;box-shadow:0 24px 60px -18px rgba(0,0,0,.7)}
.cp-head{font-size:13px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.cp-sub{font-size:10.5px;font-weight:500;color:var(--faint);text-transform:none;letter-spacing:0}
.cp-sec{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:11px 2px 5px}
.cp-list{display:flex;flex-direction:column;gap:1px;max-height:232px;overflow:auto}
.cp-row{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:8px}
.cp-row:hover{background:var(--glass-3)}
.cp-ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--stroke);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;flex:none}
.cp-row.on .cp-ck{background:var(--violet);border-color:var(--violet)}
.cp-l{flex:1;font-size:12.5px;color:var(--ink)}
.cp-mv{display:flex;gap:2px}
.cp-mv button{width:22px;height:22px;border-radius:6px;border:1px solid transparent;background:var(--glass-2);color:var(--faint);cursor:pointer;display:grid;place-items:center}
.cp-mv button:hover{color:var(--ink);border-color:var(--stroke-2)}
.cp-mv button:disabled{opacity:.3;cursor:default}
.cp-reset{margin-top:11px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border-radius:9px;border:1px solid var(--stroke-2);background:none;color:var(--sub);font-size:12px;cursor:pointer}
.cp-reset:hover{color:var(--ink);border-color:var(--stroke)}

.vmenu{width:250px}
.vm-save{display:flex;gap:6px;margin-bottom:4px}

.nav-menu{position:absolute;top:38px;left:0;z-index:91;min-width:210px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:13px;box-shadow:0 26px 60px -20px rgba(0,0,0,.7);padding:6px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--ink);background:none;border:0;cursor:pointer;padding:9px 11px;border-radius:9px}
.nav-i:hover{background:var(--glass-3)}
.nav-i.on{background:linear-gradient(135deg,rgba(142,124,255,.18),rgba(79,139,255,.12));color:#fff}
.nav-i.add{color:var(--violet)}
.nav-sep{height:1px;background:var(--stroke-2);margin:5px 4px}
.objwrap{flex:1;overflow:auto;padding:16px 20px 26px;display:flex;flex-direction:column}
.obj-bar{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.obj-h{display:flex;align-items:center;gap:12px}
.obj-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.obj-title{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.obj-sub{font-size:12px;color:var(--sub);margin-top:2px}
.obj-tools{margin-left:auto;display:flex;gap:9px}
.ol-table{border:1px solid var(--stroke);border-radius:14px;overflow:hidden;background:var(--glass)}
.ol-head{display:grid;gap:0;background:var(--glass-2);border-bottom:1px solid var(--stroke)}
.ol-th{padding:11px 14px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.ol-body{}
.ol-row{display:grid;gap:0;cursor:pointer;border-bottom:1px solid var(--stroke-2);transition:background .12s}
.ol-row:last-child{border-bottom:0}
.ol-row:hover{background:var(--glass-3)}
.ol-td{padding:12px 14px;font-size:12.5px;color:var(--ink);display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol-td.first{font-weight:600}
.ol-mt{color:var(--faint)}
.ol-link{color:var(--cyan)}
.ol-pill{font-size:11px;padding:2px 9px;border-radius:8px;background:var(--glass-3);border:1px solid var(--stroke-2);color:var(--sub)}
.ol-chk{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--stroke);display:inline-grid;place-items:center}
.ol-chk.on{background:var(--green);border-color:var(--green)}
.ol-empty{padding:30px;text-align:center;color:var(--faint);font-size:12.5px}
.rec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.rec-back{width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);background:var(--glass-2);color:var(--sub);cursor:pointer;display:grid;place-items:center;flex:none}
.rec-back:hover{color:var(--ink)}
.rec-name{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.orf{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--stroke-2)}
.orf:last-child{border-bottom:0}
.orf-l{width:120px;flex:none;font-size:12px;color:var(--sub);font-weight:600}
.orf-v{flex:1;min-width:0}
.orf-in,.orf-sel,.orf-ta{width:100%;background:var(--glass-2);border:1px solid var(--stroke-2);border-radius:8px;color:var(--ink);font:inherit;font-size:12.5px;padding:7px 9px;outline:none}
.orf-in:focus,.orf-sel:focus,.orf-ta:focus{border-color:var(--violet);background:var(--glass-3)}
.orf-chk{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;font-weight:600;color:var(--sub);background:var(--glass-2);border:1px solid var(--stroke-2);border-radius:8px;padding:6px 11px;cursor:pointer}
.orf-chk.on{color:#fff;background:var(--green);border-color:var(--green)}
.rr-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:12.5px}
.rr-v{font-size:12px;color:var(--sub)}
.pbpanel{border:1px solid var(--stroke);border-radius:14px;background:rgba(142,124,255,.06);padding:14px 16px;margin-bottom:14px}
.pb-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink);margin-bottom:11px}
.pb-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pb-field{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--glass-2);border:1px solid var(--stroke-2);border-radius:9px}
.pb-ft{font-size:12.5px;font-weight:600;color:var(--ink);flex:1}
.pb-tt{font-size:11px;color:var(--sub);font-family:var(--mono)}
.pb-lock{font-size:10px;color:var(--faint);font-family:var(--mono)}
.pb-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pb-note{font-size:11px;color:var(--faint);margin-top:9px}
.aicell{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink)}
.aicell .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
.db-scrim{position:fixed;inset:0;z-index:150;background:rgba(4,6,16,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
body.light .db-scrim{background:rgba(40,48,80,.22)}
.dbpanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:151;width:min(660px,96vw);max-height:88vh;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--stroke);border-radius:16px;box-shadow:0 40px 90px -24px rgba(0,0,0,.75);overflow:hidden}
.db-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--stroke-2)}
.db-body{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.db-litbl{border:1px solid var(--stroke-2);border-radius:12px;overflow:hidden}
.db-lihead{display:grid;grid-template-columns:1fr 64px 110px 92px 30px;gap:8px;padding:9px 12px;background:var(--glass-2);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.db-lihead .db-qh,.db-lihead .db-uh,.db-lihead .db-ah{text-align:right}
.db-li{display:grid;grid-template-columns:1fr 64px 110px 92px 30px;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--stroke-2)}
.db-in{background:var(--glass-2);border:1px solid var(--stroke-2);border-radius:8px;color:var(--ink);font:inherit;font-size:12.5px;padding:7px 9px;outline:none;width:100%}
.db-in:focus{border-color:var(--violet);background:var(--glass-3)}
.db-qty,.db-unit{text-align:right;font-family:var(--mono)}
.db-amt{text-align:right;font-family:var(--mono);font-weight:700;color:var(--ink);font-size:12.5px}
.db-del{width:26px;height:26px;border-radius:7px;border:0;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center}
.db-del:hover{color:var(--rose);background:var(--glass-3)}
.db-addli{display:flex;align-items:center;gap:7px;width:100%;justify-content:center;padding:10px;border:0;border-top:1px dashed var(--stroke-2);background:none;color:var(--violet);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.db-addli:hover{background:var(--glass-3)}
.db-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.db-f{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--sub);font-weight:600}
.db-tot{border-top:1px solid var(--stroke-2);padding-top:12px;display:flex;flex-direction:column;gap:6px;max-width:300px;margin-left:auto;width:100%}
.dbtr{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}
.dbtr span:last-child{font-family:var(--mono);color:var(--ink)}
.dbtr.grand{border-top:1px solid var(--stroke-2);padding-top:8px;margin-top:2px;font-size:15px;font-weight:700}
.db-foot{display:flex;justify-content:flex-end;gap:10px;padding:13px 18px;border-top:1px solid var(--stroke-2)}
@media(max-width:560px){.db-lihead,.db-li{grid-template-columns:1fr 48px 80px 64px 24px}.db-fields{grid-template-columns:1fr}}
.stagepill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:8px;background:color-mix(in srgb,var(--pc,#4F8BFF) 13%,transparent);color:var(--pc,#4F8BFF)}
body.light .stagepill{background:color-mix(in srgb,var(--pc,#4F8BFF) 16%,#fff);color:color-mix(in srgb,var(--pc,#4F8BFF) 42%,#0b1020)}
.hval{color:var(--hc)}
body.light .hval{color:color-mix(in srgb,var(--hc,#36E2A0) 46%,#0b1020)}
.fg-h[style*="--fgc"]{color:var(--fgc)}
body.light .fg-h[style*="--fgc"]{color:color-mix(in srgb,var(--fgc) 44%,#0b1020)}
.fic{background:color-mix(in srgb,var(--pc,#4F8BFF) 12%,transparent);color:var(--pc,#4F8BFF)}
body.light .fic{background:color-mix(in srgb,var(--pc,#4F8BFF) 14%,#fff);color:color-mix(in srgb,var(--pc,#4F8BFF) 42%,#0b1020)}
.fmeta .typ{background:color-mix(in srgb,var(--pc,#4F8BFF) 12%,transparent);color:var(--pc,#4F8BFF)}
body.light .fmeta .typ{background:color-mix(in srgb,var(--pc,#4F8BFF) 14%,#fff);color:color-mix(in srgb,var(--pc,#4F8BFF) 42%,#0b1020)}
.vtl-typ{color:var(--pc,#4F8BFF)}
body.light .vtl-typ{color:color-mix(in srgb,var(--pc,#4F8BFF) 42%,#0b1020)}
.stagepill .d{width:6px;height:6px;border-radius:50%}

/* ---------------- preview ---------------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(6,9,20,.5);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pop{position:fixed;z-index:70;width:340px;border-radius:var(--r);overflow:hidden;animation:popin .26s var(--sp);transform-origin:top left}
@keyframes popin{from{opacity:0;transform:scale(.93) translateY(6px)}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;z-index:70;border-left:1px solid var(--stroke-2);
  background:linear-gradient(180deg,rgba(14,19,42,.96),rgba(9,13,32,.97));backdrop-filter:blur(26px);box-shadow:-30px 0 80px -30px rgba(0,0,0,.7);
  animation:slidein .3s var(--sp);overflow-y:auto}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}}
.pv-head{padding:16px 17px;background:var(--ch-soft,rgba(255,255,255,.04));border-bottom:1px solid var(--stroke);position:relative}
.pv-head::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ch,var(--grad))}
.pv-body{padding:15px 17px;display:flex;flex-direction:column;gap:14px}
.pv-stat{display:flex;gap:9px}
.pv-stat .b{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:11px;padding:9px 11px}
.pv-stat .b .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.pv-stat .b .v{font-family:var(--mono);font-weight:700;font-size:15px;margin-top:2px}
.pv-sec-t{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.miniact{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--stroke)}
.miniact:first-child{border-top:none}

/* ---------------- detail ---------------- */
.detail{flex:1;overflow-y:auto;min-height:0}
.dwrap{max-width:1500px;margin:0 auto;padding:18px 22px 44px}
.dhead{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;border-radius:var(--r);position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--stroke)}
.dhead::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ch,var(--grad))}
.dhead .h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:9px 0 4px}
.dhead .sub{color:var(--sub);font-size:13px}
.dhead .right{margin-left:auto;text-align:right}
.dval{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.dmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.chip .k{color:var(--faint);font-weight:500}

/* stage rail in header */
.srail{display:flex;align-items:center;gap:0;margin-top:16px}
.srail .s{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;font:inherit;padding:3px}
.srail .s .b{width:24px;height:24px;border-radius:50%;border:2px solid var(--stroke-2);display:grid;place-items:center;transition:.22s var(--sp);flex:none}
.srail .s .l{font-size:12px;font-weight:600;white-space:nowrap;color:var(--faint)}
.srail .s:hover .b{transform:translateY(-2px)}
.srail .ln{width:24px;height:2px;background:rgba(255,255,255,.1);margin:0 2px;border-radius:2px}
.srail .ln.f{background:var(--grad)}
.srail .spacer{flex:1}

/* AI Claude strip */
.aibar{margin-top:16px;border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(142,124,255,.13),rgba(51,225,230,.07) 70%);border:1px solid rgba(142,124,255,.3)}
.aibar::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(142,124,255,.4),transparent 60%);filter:blur(20px);pointer-events:none}
.aibar-h{display:flex;align-items:center;gap:11px}
.spark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow);flex:none;position:relative;z-index:1}
.aibar .ti{font-family:var(--display);font-weight:600;font-size:14px}
.aibar .st{font-size:11px;color:var(--sub)}
.ai-stream{margin:12px 0 4px;font-size:13.5px;line-height:1.6;color:#e6e9ff;position:relative;z-index:1;min-height:22px}
.ai-stream b{color:#fff}
.caret{display:inline-block;width:7px;height:15px;background:var(--cyan);margin-left:2px;border-radius:1px;vertical-align:-2px;animation:blink 1s steps(2) infinite;box-shadow:0 0 8px var(--cyan)}
@keyframes blink{50%{opacity:0}}
.ai-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
.aichip{font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;color:#dfe2ff;
  background:rgba(255,255,255,.06);border:1px solid rgba(142,124,255,.3);transition:.16s var(--ease);display:inline-flex;align-items:center;gap:6px}
.aichip:hover{border-color:rgba(142,124,255,.7);background:rgba(142,124,255,.16);transform:translateY(-1px)}
.ai-input{margin-top:13px;display:flex;gap:9px;align-items:center;background:rgba(8,11,26,.6);border:1px solid rgba(142,124,255,.35);border-radius:13px;padding:7px 7px 7px 15px;position:relative;z-index:1;transition:.2s}
.ai-input:focus-within{border-color:rgba(142,124,255,.7);box-shadow:0 0 26px -8px rgba(142,124,255,.7)}
.ai-input input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:13.5px}
.ai-input input::placeholder{color:var(--faint)}
.ai-send{width:36px;height:36px;border-radius:10px;background:var(--grad);border:none;display:grid;place-items:center;cursor:pointer;box-shadow:var(--glow);transition:.16s}
.ai-send:hover{filter:brightness(1.1);box-shadow:var(--glow-strong)}
.ai-thread{margin-top:13px;display:flex;flex-direction:column;gap:11px;position:relative;z-index:1}
.amsg{display:flex;gap:10px;align-items:flex-start}
.amsg .who{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.amsg.ai .who{background:rgba(142,124,255,.2);color:#bcbfff}
.amsg.me{flex-direction:row-reverse}
.amsg.me .who{background:var(--glass-3);color:var(--sub)}
.amsg .mb{font-size:13px;line-height:1.55;padding:9px 13px;border-radius:13px;max-width:80%}
.amsg.ai .mb{background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.amsg.me .mb{background:linear-gradient(135deg,rgba(91,124,255,.25),rgba(155,107,255,.2));border:1px solid rgba(142,124,255,.3)}

/* detail grid */
.dgrid{display:grid;grid-template-columns:1fr 376px;gap:18px;margin-top:18px;align-items:start}
.dgrid3{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:16px;margin-top:18px;align-items:start}
.col-l,.col-c,.col-r{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:1180px){.dgrid3{grid-template-columns:1fr}}
.dhead-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.lay-sw{display:inline-flex;gap:2px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:9px;padding:2px;margin-left:auto}
.lay-b{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:7px;border:none;background:none;color:var(--sub);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:.14s}
.lay-b:hover{color:var(--ink)}
.lay-b.on{background:var(--glass-3);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.22)}
body.light .lay-b.on{border:1px solid var(--stroke-2)}
.proplist{display:flex;flex-direction:column}
.prop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--stroke)}
.prop:last-child{border-bottom:none}
.pk{font-size:11.5px;color:var(--faint);font-weight:600;flex:none}
.pv{font-size:12.5px;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:6px;text-align:right;min-width:0;justify-content:flex-end}
.pv.pcap{text-transform:capitalize}
.pv-edit{position:relative;cursor:pointer;border-radius:7px;padding:2px 6px;margin:-2px -6px -2px 0;min-width:58px;transition:background .14s,box-shadow .14s}
.pv-edit:hover{background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--stroke-2)}
.pv-edit:hover::after{content:"✎";position:absolute;left:-15px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--faint)}
body.light .pv-edit:hover{background:rgba(15,23,42,.05)}
.prop-hint{margin-left:auto;font-size:10px;font-weight:600;color:var(--faint);display:inline-flex;align-items:center;gap:4px;letter-spacing:0;text-transform:none}
.card{border-radius:var(--r);background:var(--glass);border:1px solid var(--stroke);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--stroke)}
.card-h .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--violet)}
.card-h .t{font-family:var(--display);font-weight:600;font-size:13.5px}
.card-h .x{margin-left:auto;color:var(--faint);font-size:11.5px;font-family:var(--mono)}
.card-b{padding:14px 16px}

/* 360 activity center */
.actbar{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--stroke);flex-wrap:wrap}
.atab{font:inherit;font-size:12.5px;font-weight:600;color:var(--sub);background:rgba(255,255,255,.04);border:1px solid var(--stroke);
  border-radius:10px;padding:7px 12px;cursor:grab;display:inline-flex;align-items:center;gap:7px;transition:.16s var(--ease);user-select:none;position:relative}
.atab:hover{color:var(--ink);border-color:var(--stroke-2)}
.atab.on{color:#fff;border-color:transparent;background:var(--ac,var(--grad));box-shadow:0 4px 16px -6px var(--acs,rgba(120,124,255,.6))}
.atab .ct{font-family:var(--mono);font-size:10px;opacity:.8}
.atab.dragging{opacity:.5}
.atab.dropbefore::before,.atab.dropafter::after{content:"";position:absolute;top:4px;bottom:4px;width:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);border-radius:2px}
.atab.dropbefore::before{left:-5px}.atab.dropafter::after{right:-5px}
.rehint{font-size:10.5px;color:var(--dim);margin-left:auto;display:inline-flex;align-items:center;gap:5px}

.composer{padding:13px 16px;border-bottom:1px solid var(--stroke);display:flex;gap:10px;align-items:flex-start}

.v360{padding:20px 26px 64px;max-width:1480px;margin:0 auto}
.v360-head{margin-bottom:16px}
.v360-ttl{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:21px;font-weight:680;letter-spacing:-.02em;color:var(--ink)}
.v360-sub{margin-top:5px;font-size:12.5px;color:var(--sub)}
.v360-sub b{color:var(--ink);font-family:var(--mono);font-weight:600}
.v360-grid{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:20px;align-items:start}
.v360-main{min-width:0}
.v360-bar{position:sticky;top:0;z-index:4;background:linear-gradient(var(--bg) 78%,transparent);padding:4px 0 12px}
.v360-chips{flex-wrap:wrap}
.v360-feed{padding:0 2px 16px}
.v360-row{position:relative;padding-top:7px}
.v360-row .fitem{padding-top:6px}
.v360-dchip{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:11px;font-weight:600;color:var(--sub);background:var(--glass-2);border:1px solid var(--stroke);border-radius:8px;padding:3px 10px 3px 8px;margin-left:49px;cursor:pointer;transition:.14s;max-width:calc(100% - 49px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.v360-dchip b{color:var(--ink);font-weight:700}
.v360-dchip:hover{color:var(--ink);border-color:var(--stroke-2);transform:translateY(-1px)}
.vd-dot{width:7px;height:7px;border-radius:50%;flex:none}
.v360-rail{position:sticky;top:8px;background:var(--glass);border:1px solid var(--stroke);border-radius:16px;overflow:hidden;backdrop-filter:blur(var(--blur))}
.v360-railhead{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:13px;font-weight:680;color:var(--ink);padding:15px 17px;border-bottom:1px solid var(--stroke)}
.vr-ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--sub);background:var(--glass-3);border-radius:20px;padding:2px 9px}
.v360-tlwrap{max-height:74vh;overflow-y:auto;padding:6px 17px 14px}
.v360-tl{display:flex;gap:12px;padding:10px 0;position:relative}
.vtl-line{position:absolute;left:5px;top:21px;bottom:-10px;width:2px;background:linear-gradient(var(--stroke),transparent)}
.v360-tl:last-child .vtl-line{display:none}
.vtl-dot{width:12px;height:12px;border-radius:50%;margin-top:2px;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--glass) 75%,transparent)}
.vtl-body{min-width:0;flex:1}
.vtl-top{display:flex;align-items:baseline;gap:8px}
.vtl-typ{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.vtl-w{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:auto;flex:none}
.vtl-sum{font-size:12px;color:var(--ink);margin-top:2px;line-height:1.42;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vtl-deal{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font:inherit;font-size:10.5px;font-weight:600;color:var(--cyan);background:none;border:none;padding:0;cursor:pointer}
.vtl-deal:hover{text-decoration:underline}
.vtl-empty{padding:30px 6px;color:var(--faint);font-size:12px;text-align:center}
@media(max-width:1080px){.v360-grid{grid-template-columns:1fr}.v360-rail{position:static;max-height:none}.v360-tlwrap{max-height:none}}
.feedgroup{margin-bottom:4px}
.fg-h{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px;padding:13px 0 2px}
/* ===== floating compose dock (Gmail-style, min/max) ===== */
.cdock{position:fixed;right:22px;bottom:0;z-index:120;display:flex;align-items:flex-end;gap:14px;max-width:calc(100vw - 24px)}
@media(max-width:600px){.cdock{left:10px;right:10px;justify-content:stretch}.cwin{width:100%;max-width:none}.rdrawer.rd-log{left:10px;right:10px;width:auto;top:56px;bottom:10px}.cwin.max{width:calc(100vw - 20px)}.cmpbox{width:calc(100vw - 20px)}}
.cwin{width:404px;max-width:calc(100vw - 40px);max-height:calc(100dvh - 14px);background:linear-gradient(180deg,rgba(17,23,46,.99),rgba(11,15,32,.99));border:1px solid var(--stroke-2);border-bottom:none;border-radius:16px 16px 0 0;box-shadow:0 -10px 50px -14px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.03),0 -2px 70px -36px var(--ac);display:flex;flex-direction:column;overflow:hidden;animation:winin .26s var(--sp)}
@keyframes winin{from{opacity:0;transform:translateY(28px)}}
.cwin-head{display:flex;align-items:center;gap:9px;padding:10px 11px;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 26%,#0c1430),color-mix(in srgb,var(--ac) 9%,#0c1430));border-bottom:1px solid var(--stroke)}
.cwin-ic{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex:none;background:rgba(0,0,0,.3)}
.cwin-tt{flex:1;min-width:0}
.cwin-t{font-family:var(--display);font-weight:600;font-size:13px;color:#fff;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cwin-sub{font-size:10px;color:rgba(255,255,255,.62);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.cwin-ctrls{display:flex;gap:2px;flex:none}
.cwin-ctrls button{width:27px;height:27px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,.78);cursor:pointer;display:grid;place-items:center;transition:.14s}
.cwin-ctrls button:hover{background:rgba(255,255,255,.18);color:#fff}
.cwin-ctrls button.cw-close:hover{background:#FF6B81;color:#fff}
.cwin-body{padding:13px 14px;overflow-y:auto;max-height:min(56vh,540px);display:flex;flex-direction:column;gap:9px;flex:1 1 auto;min-height:0}
.cwin-foot{padding:10px 14px;border-top:1px solid var(--stroke);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(0,0,0,.18)}
.cwin-foot .btn{margin-left:auto}
.cwin-foot .hint{margin:0}
.cwin.min{width:290px}
.cwin.min .cwin-head{cursor:pointer;border-bottom:none;border-radius:16px 16px 0 0}
.cwin.min .cwin-head:hover{filter:brightness(1.12)}
.cwin.max{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:calc(100dvh - 28px);border-radius:16px;border:1px solid var(--stroke-2);z-index:130;box-shadow:0 30px 90px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04),0 0 90px -42px var(--ac);animation:maxin .28s var(--sp)}
@keyframes maxin{from{opacity:0;transform:translate(-50%,-46%) scale(.98)}}
.cwin.max .cwin-body{max-height:none;flex:1 1 auto;min-height:0}
.cwin-scrim{position:fixed;inset:0;background:rgba(4,6,16,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:125;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}}
.ins-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ins-group{border:1px solid var(--stroke);border-radius:11px;padding:9px 10px;display:flex;flex-direction:column;gap:7px;background:rgba(255,255,255,.018)}
.ins-group>.cl{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ins-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cmail-head{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);padding-bottom:1px}
.cmail-hint{color:var(--faint);font-size:11.5px;font-weight:500}
.cmail-compose{display:flex;flex-direction:column;border:1px solid var(--stroke);border-radius:12px;overflow:hidden;background:rgba(8,11,26,.55)}
.cmail-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 9px;border-bottom:1px solid var(--stroke);background:var(--glass)}
.cmail-bar-sep{width:1px;height:18px;background:var(--stroke-2);margin:0 2px}
.cmail-bar-l{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:inline-flex;align-items:center;gap:5px}
.cmail-body{border:none!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;min-height:128px}
.cmail-more{border:1px solid var(--stroke);border-radius:12px;background:rgba(255,255,255,.014);overflow:hidden}
.cmail-sum{display:flex;align-items:center;gap:7px;cursor:pointer;padding:10px 12px;font-size:12px;font-weight:700;color:var(--sub);list-style:none;user-select:none}
.cmail-sum::-webkit-details-marker{display:none}
.cmail-sum:hover{color:var(--ink)}
.cmail-ct{font-family:var(--mono);font-size:10.5px;background:rgba(79,139,255,.18);color:var(--blue);border-radius:6px;padding:1px 6px;font-weight:700}
.cmail-sum-x{margin-left:auto;color:var(--faint);transition:transform .18s}
.cmail-more[open] .cmail-sum-x{transform:rotate(180deg)}
.cmail-more-b{display:flex;flex-direction:column;gap:8px;padding:0 11px 11px}
body.light .cmail-compose,body.light .cmail-more{background:#fff}
body.light .cmail-bar{background:#F3F6FC}
.chipx.mkt.on{background:rgba(255,99,176,.18);border-color:rgba(255,99,176,.5);color:#FFA6D2}
.chipx.auto.on{background:rgba(51,225,230,.16);border-color:rgba(51,225,230,.5);color:#9af0f2}
.auto-note{font-size:11px;color:var(--sub);line-height:1.5;display:flex;gap:6px;align-items:flex-start;background:rgba(51,225,230,.07);border-radius:8px;padding:7px 9px}
.docchip.mini.mkt .dn{color:#FFA6D2}
/* ===== right-side drawer (new deal + enlarged preview) ===== */
.rd-scrim{position:fixed;inset:0;background:rgba(4,6,16,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:140;animation:fadein .2s ease}
.rdrawer{position:fixed;top:0;right:0;height:100vh;width:min(460px,96vw);background:linear-gradient(180deg,#0c1230,#0a0e22);border-left:1px solid var(--stroke-2);box-shadow:-30px 0 80px -30px rgba(0,0,0,.8);z-index:141;display:flex;flex-direction:column;animation:rdin .3s var(--sp)}
.rdrawer.rd-peek{width:min(500px,96vw)}
@keyframes rdin{from{transform:translateX(46px);opacity:.4}}
.rd-head{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--stroke)}
.rd-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.rd-t{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-sub{font-size:11.5px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-x{width:32px;height:32px;border-radius:9px;border:1px solid var(--stroke);background:var(--glass-2);color:var(--sub);cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s}
.rd-x:hover{color:var(--ink);background:var(--glass-3);border-color:var(--stroke-2)}
.rd-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:13px}
.rd-foot{padding:13px 18px;border-top:1px solid var(--stroke);display:flex;gap:10px;justify-content:flex-end;background:rgba(0,0,0,.18)}
.btn.danger{color:var(--rose)}.btn.danger:hover{border-color:color-mix(in srgb,var(--rose) 50%,transparent);background:rgba(255,107,129,.1)}
.ndl{display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.ndl .ndhint,.ndl>span{font-weight:600;text-transform:none;letter-spacing:0;color:var(--dim)}
.ndi{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--glass);border:1px solid var(--stroke);border-radius:8px;padding:9px 11px;outline:none;transition:.15s}
.ndi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,139,255,.16);background:#0e1430}
select.ndi{cursor:pointer}
.nd2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ndchips{display:flex;gap:6px;flex-wrap:wrap}
.ndchips .chipx.on{background:color-mix(in srgb,var(--fc,#4F8BFF) 78%,#0b1020);border-color:transparent;color:#fff}
.ndchips .chipx.own{padding-left:5px}
.nd-divide{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--stroke);padding-top:14px;margin-top:2px;display:flex;gap:7px;align-items:center}
.nd-divide span{font-weight:600;text-transform:none;letter-spacing:0;color:var(--dim);font-size:10.5px}
.ndprods{display:flex;flex-direction:column;gap:7px}
.ndprod{display:flex;align-items:center;gap:10px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:9px;padding:8px 9px 8px 12px}
.ndprod-n{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ndprod-v{font-size:12px;color:var(--sub);flex:none}
.ndprod-x{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1px solid var(--stroke);background:none;color:var(--faint);cursor:pointer;transition:.14s}
.ndprod-x:hover{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 55%,transparent);background:color-mix(in srgb,var(--rose) 12%,transparent);transform:translateY(-1px)}
.ndprod-empty{font-size:11.5px;color:var(--dim);padding:2px 1px 1px;line-height:1.5}
.ndprod-add{display:flex;gap:8px}
.ndprod-add .ndi{flex:1;min-width:0}
.ndprod-add .btn{flex:none}
.ndprod-sum{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:3px 2px 0}
.ndprod-sum b{font-size:13px;color:var(--ink);letter-spacing:0}
.ndassoc{display:flex;flex-direction:column;gap:9px}
.ndassoc-types{display:flex;gap:6px;flex-wrap:wrap}
.ndassoc-list{display:flex;flex-direction:column;gap:7px}
.a-tic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc,#4F8BFF) 14%,transparent);color:var(--pc,#4F8BFF)}
body.light .a-tic{background:color-mix(in srgb,var(--pc,#4F8BFF) 15%,#fff);color:color-mix(in srgb,var(--pc,#4F8BFF) 42%,#0b1020)}
.a-sub{color:var(--faint);font-weight:500;font-size:11px}
.a-typ{flex:none;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);background:var(--glass-3);border:1px solid var(--stroke-2);border-radius:6px;padding:2px 7px}
.pv2-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pv2-b{background:var(--glass);border:1px solid var(--stroke);border-radius:10px;padding:9px 10px;min-width:0}
.pv2-b .k{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.pv2-b .v{font-family:var(--display);font-weight:700;font-size:15px;margin-top:3px;position:relative}
.pvsec{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--stroke);padding-top:13px}
.pvsec-t{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:6px}
.pvsum{margin-left:auto;color:var(--sub);font-weight:600;text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:11px}
.pvsub{font-size:11px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:6px;margin-top:2px}
.pvsub .pvsum{font-size:11px}
.pvnova{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--sub);line-height:1.5;background:rgba(142,124,255,.07);border:1px solid rgba(142,124,255,.2);border-radius:9px;padding:8px 10px}
.pvnova svg{flex:none;margin-top:1px}
body.light .pvnova{background:rgba(142,124,255,.08);border-color:rgba(142,124,255,.28)}
.pvgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.pvrow{display:flex;flex-direction:column;gap:3px;min-width:0}
.pvrow .pk{font-size:10px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pvrow .pvv{font-size:12.5px;color:var(--ink);font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pveditable{position:relative;min-height:21px;display:inline-flex;align-items:center;border-radius:6px;padding:1px 5px;margin:-1px -5px;cursor:text;transition:background .14s,box-shadow .14s}
.pveditable:hover{background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--stroke-2)}
.pvline{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--stroke);gap:10px}
.pvline:last-child{border-bottom:none}
.pvc{display:flex;align-items:center;gap:9px;padding:4px 0}
.pvmuted{font-size:12px;color:var(--faint)}
/* ===== filters: bar, facets, advanced builder ===== */
.fbar{position:relative;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 22px;border-bottom:1px solid var(--stroke);background:rgba(8,11,26,.45)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:12px 22px 11px;border-bottom:1px solid var(--stroke);background:linear-gradient(180deg,rgba(142,124,255,.05),transparent)}
.pbar-l{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
.pbar-lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.pbar-pipes{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pipe-add{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;font-weight:600;color:var(--violet);background:rgba(142,124,255,.1);border:1px dashed rgba(142,124,255,.45);border-radius:9px;padding:6px 11px;cursor:pointer;transition:.13s}
.pipe-add:hover{background:rgba(142,124,255,.2);border-style:solid}
body.light .pipe-add{background:rgba(142,124,255,.09)}
.pipe-newform{display:inline-flex;align-items:center;gap:5px}
.pipe-newin{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--glass-2);border:1.5px solid var(--violet);border-radius:9px;padding:6px 10px;outline:none;width:170px;box-shadow:0 0 0 3px rgba(142,124,255,.16)}
body.light .pipe-newin{background:#fff}
.pipe-newok,.pipe-newx{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--stroke-2);background:var(--glass-2)}
.pipe-newok{color:var(--green);border-color:rgba(54,226,160,.4)}
.pipe-newok:hover{background:rgba(54,226,160,.16)}
.pipe-newx{color:var(--sub)}
.pipe-newx:hover{color:var(--ink);background:var(--glass-3)}
.pbar-stats{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pbar-stat{display:flex;flex-direction:column;gap:1px;text-align:right}
.pbar-stat .k{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.pbar-stat .v{font-size:15px;font-weight:700;color:var(--ink);line-height:1.1}
@media(max-width:760px){.pbar-stats{gap:14px}.pbar-stat .v{font-size:13px}}
/* pipeline dropdown selector */
.pdrop{position:relative}
.pdrop-t{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);background:var(--glass-2);border:1px solid var(--stroke-2);border-radius:11px;padding:8px 12px;cursor:pointer;transition:.14s;min-width:210px}
.pdrop-t:hover{border-color:var(--stroke-3);background:var(--glass-3)}
.pdrop-t.open{border-color:var(--violet);box-shadow:0 0 0 3px rgba(142,124,255,.16)}
.pdrop-dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.pdrop-name{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdrop-ct{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--sub);background:var(--glass-3);border:1px solid var(--stroke-2);border-radius:20px;padding:1px 8px;min-width:22px;text-align:center}
.pdrop-cv{color:var(--faint);display:inline-flex;transition:transform .18s}
.pdrop-t.open .pdrop-cv{transform:rotate(180deg)}
.pdrop-scrim{position:fixed;inset:0;z-index:60}

function greet(d){return `I've reviewed everything on <b>${esc(d.name)}</b> — ${d.acts.length} activities across ${new Set(d.acts.map(a=>a.type)).size} channels. Ask me to summarize, surface risks, draft outreach, or plan the next move.`;}
function answerFor(d,q){const t=q.toLowerCase();const hc=d.health>=75?'healthy':d.health>=50?'mixed':'at risk';
 if(/risk|danger|worry|concern/.test(t)){if(d.health<50)return `Top risk: this deal is <b>${hc}</b> at health ${d.health}. ${d.tags.includes('At-risk')?'It has stalled — re-engagement is urgent.':'Watch engagement closely.'} I'd escalate to the economic buyer and confirm the timeline.`;return `Signals look <b>${hc}</b> (health ${d.health}, win ${d.win}%). No material risks — keep momentum and close on the agreed paper path.`;}
 if(/summar|overview|recap|tell me/.test(t))return esc(d.summary);
 if(/draft|email|follow.?up|write|outreach|whatsapp|message/.test(t)){const c=d.contacts[0];return `Here's a follow-up to <b>${esc(c?c.n:'the buyer')}</b>:<br><br>"Hi ${c?c.n.split(' ')[0]:'there'} — thanks for the time on ${esc(d.company)}. ${d.next?'As a next step, '+d.next.toLowerCase()+'.':'Wanted to keep things moving.'} Happy to jump on a quick call this week — does Thursday work?"<br><br>Want me to send it or tweak the tone?`;}
 if(/next|do|action|move|advance/.test(t))return d.next?`Recommended next action: <b>${esc(d.next)}</b>. ${d.win>=70?'Confidence is high — push for signature.':'Confirm the buying group is aligned before advancing the stage.'}`:`No next step is logged. I'd set one — start by confirming the economic buyer and the decision timeline.`;
 if(/win|forecast|likely|close|chance/.test(t))return `AI win-likelihood is <b>${d.win}%</b> and health is ${d.health} (${hc}). Forecast close: <b>${esc(d.close)}</b> at ${fmtFull(d.value)}.`;
 if(/who|contact|stake|buyer|champion/.test(t))return `Buying group: ${d.contacts.map(c=>`<b>${esc(c.n)}</b> (${c.r})`).join(', ')}. ${d.contacts.some(c=>c.r==='Economic buyer')?'Economic buyer is identified.':'No economic buyer confirmed yet — that\'s the gap.'}`;
 return `On <b>${esc(d.name)}</b>: ${esc(d.summary)} Ask me about risks, the buying group, or the next action.`;
}

function beginEdit(cell){const id=cell.dataset.id,k=cell.dataset.k,d=S.deals.find(x=>x.id===id);if(!d)return;const type=EDITABLE[k];let input,done=false;
 if(type==='enum'){input=document.createElement('select');input.className='cellin';const opts=k==='stage'?STAGES.map(s=>s.k):k==='owner'?Object.keys(OWNERS):['high','med','low'];opts.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=k==='owner'?OWNERS[o].name:o;if(d[k]===o)op.selected=true;input.appendChild(op);});}
 else{input=document.createElement('input');input.className='cellin';input.value=type==='num'?(d[k]||0):d[k];}
 cell.appendChild(input);input.focus();if(input.select)try{input.select();}catch(e){}
 const commit=()=>{if(done)return;done=true;let v=input.value;if(type==='num'){v=Math.max(0,parseInt(String(v).replace(/[^0-9]/g,''))||0);if(k==='health')v=Math.min(100,v);}if(k==='stage'){if(v!==d.stage){const r=changeStage(d,v,{});if(r===true)toast('Moved to '+v);}renderApp();return;}pushUndo();d[k]=v;renderApp();};

function flipBoard(mutate){const items=[...document.querySelectorAll('#board .kcard, #board .placeholder')];const first=new Map();items.forEach(el=>first.set(el,el.getBoundingClientRect()));mutate();if(reduced())return;items.forEach(el=>{const a=first.get(el);if(!a)return;const b=el.getBoundingClientRect();const dx=a.left-b.left,dy=a.top-b.top;if(!dx&&!dy)return;el.style.transition='none';el.style.transform=`translate(${dx}px,${dy}px)`;requestAnimationFrame(()=>{el.style.transition='transform .34s cubic-bezier(.34,1.2,.5,1)';el.style.transform='';});});}
function onCardMove(e,D){const vx=e.clientX-D.lastX;D.lastX=e.clientX;const tilt=reduced()?0:Math.max(-12,Math.min(12,vx*0.9));
 D.ghost.style.transform=`translate(${e.clientX-D.ox-D.sx}px,${e.clientY-D.oy-D.sy}px) rotate(${tilt}deg) scale(1.03)`;
 D.ghost.style.visibility='hidden';const under=document.elementFromPoint(e.clientX,e.clientY);D.ghost.style.visibility='';
 const col=under&&under.closest('.col');if(!col)return;

 for(const cc of cards){const r=cc.getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=cc;break;}}

 if(needMove||D.ph.parentNode!==list)flipBoard(()=>{if(before)list.insertBefore(D.ph,before);else list.appendChild(D.ph);});
 const d=S.deals.find(x=>x.id===D.id);const ns=col.dataset.stage;const gf=boardField();const cur=gf==='owner'?d.owner:gf==='priority'?d.priority:d.stage;
 if(d&&ns!==cur){D.predict.style.display='block';D.predict.style.left=e.clientX+'px';D.predict.style.top=e.clientY+'px';let pc;if(gf==='stage'){const dl=probDelta(d,ns);D.predict.textContent=dl>0?'\u25b2 +'+dl+'% win':dl<0?'\u25bc '+dl+'% win':'\u2192 '+ns;pc=hueOf(ns);}else{D.predict.textContent='\u2192 '+(gf==='owner'?(OWNERS[ns]?OWNERS[ns].name:ns):ns);pc=gf==='priority'?(ns==='high'?'#FF6B81':ns==='med'?'#FFC24B':'#4F8BFF'):'#8E7CFF';}D.predict.style.borderColor=pc;D.predict.style.color=pc;}else D.predict.style.display='none';}

 const order=[...list.children].map(ch=>ch===D.ph?'__PH__':ch.dataset.id);
 const finish=()=>{D.ghost.remove();D.predict.remove();document.body.classList.remove('dragging');document.querySelectorAll('.col.hot').forEach(c=>c.classList.remove('hot'));S.drag=null;if(newStage)commitDrop(D.id,newStage,order);renderApp();flashCard(D.id);};
 reduced()?finish():setTimeout(finish,250);}
function commitDrop(id,newVal,order){const d=S.deals.find(x=>x.id===id);if(!d)return;const gf=boardField();const cur=gf==='owner'?d.owner:gf==='priority'?d.priority:d.stage;const changed=cur!==newVal;
 if(gf==='stage'&&changed){const miss=stageGateMiss(d,newVal);if(miss.length){toast('Add '+miss.join(' and ')+' before moving to '+newVal);return;}if(newVal==='Won'||newVal==='Lost'){S.capture={id:id,to:newVal};return;}}

const STAGE_GATES={Proposal:['amount'],Negotiation:['amount','close'],Won:['amount']};
function stageGateMiss(d,toStage){const need=STAGE_GATES[toStage]||[];const m=[];if(need.indexOf('amount')>=0&&!(Number(d.value)>0))m.push('an amount');if(need.indexOf('close')>=0&&(!d.close||d.close==='\u2014'||!String(d.close).trim()))m.push('a close date');return m;}
function applyStage(d,toStage,meta){d.stage=toStage;if(toStage==='Won')d.win=100;if(toStage==='Lost')d.win=0;if(meta){if(meta.reason)d.closeReason=meta.reason;if(meta.note)d.closeNote=meta.note;}pushAct(d,A('note',OWNERS[ME].name,'now','Stage moved to '+toStage+(meta&&meta.reason?(' \u00b7 '+meta.reason):'')+'.'));runAutomations('stage',d);}
function changeStage(d,toStage,opts){opts=opts||{};if(!d||d.stage===toStage)return false;const miss=stageGateMiss(d,toStage);if(miss.length){toast('Add '+miss.join(' and ')+' before moving to '+toStage);return false;}if((toStage==='Won'||toStage==='Lost')&&!opts.bulk){S.capture={id:d.id,to:toStage};return 'capture';}pushUndo();applyStage(d,toStage);if(toStage==='Won')celebrate();return true;}
function captureSheet(){const cap=S.capture;const d=S.deals.find(x=>x.id===cap.id);if(!d)return '';const won=cap.to==='Won';const c=won?'var(--green)':'var(--rose)';const reasons=won?['Competitive win','Champion-led','Strong ROI','Right timing','Expansion']:['Lost to competitor','No budget','No decision','Bad timing','Went silent','Other'];
 return `<div class="cap-scrim" data-act="cap-close"></div><div class="capsheet" style="--cc:${c}"><div class="cap-h">${ic(won?'check':'x',{s:18,c:c})}<div><b>Mark \u201c${esc(d.name)}\u201d as ${cap.to}</b><small>${won?'Capture why you won \u2014 feeds win/loss analytics.':'Capture why it slipped \u2014 feeds win/loss analytics.'}</small></div></div><label class="cap-l">Reason</label><select id="cap-reason" class="cap-in">${reasons.map(r=>`<option>${esc(r)}</option>`).join('')}</select>${won?`<label class="cap-l">Final amount</label><input id="cap-amt" class="cap-in" value="${d.value||0}">`:''}<label class="cap-l">Note <span class="cap-opt">optional</span></label><textarea id="cap-note" class="cap-in cap-ta" placeholder="Context for the team\u2026"></textarea><div class="cap-foot"><button class="btn ghost" data-act="cap-close">Cancel</button><button class="btn primary" data-act="cap-save" style="background:${c};border-color:${c}">${ic('check',{s:14,c:'#fff'})} Confirm ${cap.to}</button></div></div>`;}
function applyCapture(){const cap=S.capture;if(!cap)return;const d=S.deals.find(x=>x.id===cap.id);if(!d){S.capture=null;renderApp();return;}const re=document.getElementById('cap-reason'),nt=document.getElementById('cap-note'),am=document.getElementById('cap-amt');const reason=(re&&re.value)||'';const note=((nt&&nt.value)||'').trim();pushUndo();if(cap.to==='Won'&&am){const a=parseInt(String(am.value).replace(/[^0-9]/g,''))||0;if(a>0)d.value=a;}applyStage(d,cap.to,{reason:reason,note:note});if(cap.to==='Won')celebrate();S.capture=null;renderApp();toast(cap.to==='Won'?'Deal won':'Marked lost');}

function taskBucket(t){const a=t.a;if(a.done)return 'Done';const due=String(a.due||'').toLowerCase();if(/overdue|yesterday|ago/.test(due)||staleDays(t.d)>=14)return 'Overdue';if(due==='today')return 'Today';if(!due)return 'No date';return 'Upcoming';}

function nextBestAction(d){const openTasks=(d.acts||[]).filter(a=>a.type==='task'&&!a.done).length;const sd=staleDays(d);
 if(d.stage==='Won')return {i:'check',label:'Deal won \u2014 start onboarding',why:'Closed. Kick off delivery and send a thank-you.'};
 if(d.stage==='Lost')return {i:'reset',label:'Run a quick loss retro',why:'Capture the lesson and consider a re-engage date.'};
 if(d.health<50)return {i:'bolt',label:'Address risk factors',why:'Health is in the danger zone \u2014 see the breakdown.'};
 if(sd>=14)return {i:'clock',label:'Re-engage \u2014 '+sd+' days quiet',why:'No activity lately; send a check-in.'};
 if(d.stage==='Proposal'&&(!d.close||d.close==='\u2014'))return {i:'calendar',label:'Set a close date',why:'A target date unlocks the gate to Negotiation.'};

 return {i:'target',label:'Advance the deal',why:'Log your latest touch and move it forward.'};}
function healthFactors(d){const out=[];const sd=staleDays(d);out.push({label:'Recency',tone:sd>=14?'bad':sd>=7?'warn':'good',note:sd>=14?sd+'d quiet':sd>=7?sd+'d ago':'active'});const si=STAGES.findIndex(s=>s.k===d.stage);out.push({label:'Stage',tone:d.stage==='Lost'?'bad':si>=3?'good':'warn',note:d.stage});out.push({label:'Deal size',tone:d.value>=100000?'good':d.value>=25000?'warn':'bad',note:fmt(d.value)});const eng=(d.acts||[]).length;out.push({label:'Engagement',tone:eng>=8?'good':eng>=4?'warn':'bad',note:eng+' touches'});const champ=(d.contacts||[]).some(c=>c.r==='Economic buyer'||c.s==='Strong');out.push({label:'Champion',tone:champ?'good':'warn',note:champ?'identified':'unconfirmed'});return out;}
function coachHTML(d){const nba=nextBestAction(d);const hc=healthColor(d.health);const fac=healthFactors(d);const tc={good:'var(--green)',warn:'var(--gold)',bad:'var(--rose)'};

 if(min)return `<div class="coach"><div class="coach-nba mini"><span class="coach-ic">${ic(nba.i,{s:14,c:'#fff'})}</span><div class="coach-tx"><div class="coach-k">Next best action</div><div class="coach-l">${esc(nba.label)}</div></div>${tog}</div></div>`;
 return `<div class="coach"><div class="coach-nba"><span class="coach-ic">${ic(nba.i,{s:16,c:'#fff'})}</span><div class="coach-tx"><div class="coach-k">Next best action</div><div class="coach-l">${esc(nba.label)}</div><div class="coach-why">${esc(nba.why)}</div></div>${tog}</div><div class="coach-h"><div class="coach-ring" style="--p:${d.health};--hc:${hc}"><b class="hval" style="--hc:${hc}">${d.health}</b></div><div class="coach-fac">${fac.map(fx=>`<div class="cfac"><span class="cfac-l">${esc(fx.label)}</span><span class="cfac-d" style="color:${tc[fx.tone]}">${esc(fx.note)}</span></div>`).join('')}</div></div></div>`;}
function nlParse(q){q=(q||'').trim().toLowerCase();if(!q)return null;const setView=()=>{S.view='list';S.openId=null;};
 if(/\bwon\b/.test(q))return{desc:'Won deals',run:()=>{setView();S.filters.stage=['Won'];}};
 if(/\blost\b/.test(q))return{desc:'Lost deals',run:()=>{setView();S.filters.stage=['Lost'];}};
 if(/high[ -]?prio|priority high|top priority/.test(q))return{desc:'High priority',run:()=>{setView();S.filters.priority=['high'];}};
 if(/negotiat/.test(q))return{desc:'In negotiation',run:()=>{setView();S.filters.stage=['Negotiation'];}};
 if(/proposal/.test(q))return{desc:'In proposal',run:()=>{setView();S.filters.stage=['Proposal'];}};
 for(const k in OWNERS){const nm=OWNERS[k].name.toLowerCase(),fn=OWNERS[k].name.split(' ')[0].toLowerCase();if((q.includes(nm)||q.includes(fn))&&/deal|owned|by|\bmine\b/.test(q+' deals'))return{desc:OWNERS[k].name+'\u2019s deals',run:()=>{setView();S.filters.owner=[k];}};}
 return null;}

function ruleTrigDesc(r){const t=r.on.t;return t==='stage'?'When stage \u2192 '+(r.on.v||'any'):t==='created'?'When a deal is created':t==='stale'?'When stale \u2265 '+r.on.v+' days':t==='health'?'When health < '+r.on.v:'';}
function ruleCondDesc(r){const c=r.cond||{f:'none'};if(c.f==='priority')return 'and priority is '+c.v;if(c.f==='value')return 'and value '+(c.op==='lt'?'<':'>')+' '+fmt(+c.v);if(c.f==='owner')return 'and owned by me';return '';}
function ruleActDesc(r){const a=r.act;if(a.t==='priority')return 'set priority \u2192 '+a.v;if(a.t==='task')return 'add task \u201c'+a.v+'\u201d';if(a.t==='tag')return 'add tag '+a.v;if(a.t==='sequence'){const sq=SEQUENCES.find(s=>s.k===a.v);return 'enroll in '+(sq?sq.name:a.v);}return '';}
function ruleCondOk(r,d){const c=r.cond||{f:'none'};if(c.f==='none'||!c.f)return true;if(c.f==='priority')return d.priority===c.v;if(c.f==='value')return c.op==='lt'?d.value<(+c.v):d.value>(+c.v);if(c.f==='owner')return d.owner===ME;return true;}
function ruleApply(r,d){const a=r.act;let did=false;
 if(a.t==='priority'){if(d.priority!==a.v){d.priority=a.v;did=true;}}
