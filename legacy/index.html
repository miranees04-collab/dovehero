  case 'bulkset':{const fl=el.dataset.f,v=el.dataset.v;pushUndo();let bn=0,bb=0;S.bulk.forEach(id=>{const d=S.deals.find(x=>x.id===id);if(!d)return;if(fl==='stage'){if(d.stage===v)return;if(stageGateMiss(d,v).length){bb++;return;}applyStage(d,v);bn++;}else{d[fl]=v;bn++;}});if(fl==='stage'&&bn&&v==='Won')celebrate();S.ltMenu=null;renderApp();toast('Updated '+bn+' deal'+(bn!==1?'s':'')+(bb?(' \u00b7 '+bb+' blocked by gate'):''));break;}
  case 'bulkdel':{pushUndo();const n=S.bulk.length;const set=S.bulk.slice();if(set.includes(S.openId))S.openId=null;S.deals=S.deals.filter(d=>!set.includes(d.id));S.bulk=[];S.ltMenu=null;renderApp();toast('Deleted '+n+' deal'+(n>1?'s':''),doUndo);break;}
  case 'export':exportCSV();break;
  case 'saveview':{const i=document.getElementById('vname');const name=((i&&i.value)||'').trim()||('View '+(S.views.length+1));saveView(name);break;}
  case 'applyview':applyView(el.dataset.v);break;
  case 'delview':{const nm=el.dataset.v;S.views=S.views.filter(v=>v.name!==nm);if(S.activeView===nm)S.activeView=null;renderApp();break;}
  case 'dup':dupDeal(el.dataset.id);break;
  case 'del':delDeal(el.dataset.id);break;
  case 'ask':if(S.openId){const i=document.getElementById('aiIn');i&&i.focus();}else toast('Open any deal — Nova lives right under the deal header');break;
  case 'stub':toast(el.dataset.s||'Prototype');break;
  case 'notifs':S.notifOpen=!S.notifOpen;S.palette=false;renderApp();break;
  case 'notifs-close':S.notifOpen=false;renderApp();break;
  case 'palette-close':S.palette=false;renderApp();break;
  case 'palette-run':{const items=paletteItems();const it=items[+el.dataset.i];if(it){S.palette=false;S.notifOpen=false;it.run();renderApp();}break;}
  case 'undo':doUndo();break;
  case 'redo':doRedo();break;
  case 'toastundo':{const u=_toastUndo;_toastUndo=null;const t=document.getElementById('toast');if(t)t.classList.remove('on');if(u)u();break;}
  case 'cap-close':S.capture=null;renderApp();break;
  case 'cap-save':applyCapture();break;
  case 'boardby':S.boardMenu=!S.boardMenu;S.swimMenu=false;renderApp();break;
  case 'board-close':S.boardMenu=false;S.swimMenu=false;renderApp();break;
  case 'setboard':S.kanbanGroup=el.dataset.v;S.boardMenu=false;renderApp();break;
  case 'swimby':S.swimMenu=!S.swimMenu;S.boardMenu=false;renderApp();break;
  case 'setswim':S.swimlane=el.dataset.v;S.swimMenu=false;renderApp();break;
  case 'swimcollapse':{const sw=S.swimlane||'none';const k=sw+':'+el.dataset.v;S.swimCollapsed[k]=!S.swimCollapsed[k];renderApp();break;}
  case 'kbcompact':S.kbCompact=!S.kbCompact;renderApp();break;
  case 'kbcollapse':{const gf=boardField();const k=gf+':'+el.dataset.v;S.kbCollapsed[k]=!S.kbCollapsed[k];renderApp();break;}
  case 'kbcollapseall':{const sw=S.swimlane||'none';if(sw!=='none'){const lanes=swimLanes(sw,filtered());const all=lanes.every(l=>S.swimCollapsed[sw+':'+l.k]);lanes.forEach(l=>{S.swimCollapsed[sw+':'+l.k]=!all;});}else{const gf=boardField();const cd=boardCols();const all=cd.every(c=>S.kbCollapsed[gf+':'+c.k]);cd.forEach(c=>{S.kbCollapsed[gf+':'+c.k]=!all;});}renderApp();break;}
  case 'tasks':S.tasksOpen=!S.tasksOpen;S.notifOpen=false;S.palette=false;renderApp();break;
  case 'tasks-close':S.tasksOpen=false;renderApp();break;
  case 'tasks-scope':S.tasksScope=el.dataset.v;renderApp();break;
  case 'auto':S.autoOpen=!S.autoOpen;S.notifOpen=false;S.palette=false;renderApp();break;
  case 'auto-close':S.autoOpen=false;S.autoEdit=null;renderApp();break;
  case 'auto-run':scanAutomations();break;
  case 'role-set':S.role=(el.value!==undefined&&el.value!=='')?el.value:el.dataset.v;if(S.role!=='admin')S.autoEdit=null;renderApp();break;
  case 'auto-toggle':{if(S.role!=='admin')break;const r=(S.automations||[]).find(x=>x.id===el.dataset.id);if(r){r.enabled=!r.enabled;renderApp();}break;}
  case 'auto-del':{if(S.role!=='admin')break;S.automations=(S.automations||[]).filter(x=>x.id!==el.dataset.id);renderApp();break;}
  case 'auto-new':if(S.role==='admin'){S.autoEdit={id:'au'+Date.now(),name:'',on:{t:'stage',v:'Proposal'},cond:{f:'none'},act:{t:'task',v:''},enabled:true,_new:true};renderApp();}break;
  case 'auto-edit':{if(S.role!=='admin')break;const r=(S.automations||[]).find(x=>x.id===el.dataset.id);if(r){S.autoEdit=JSON.parse(JSON.stringify(r));renderApp();}break;}
  case 'auto-cancel':S.autoEdit=null;renderApp();break;
  case 'auto-set':{const e2=S.autoEdit;if(!e2)break;const p=el.dataset.part;const v=(el.value!==undefined&&el.value!=='')?el.value:el.dataset.v;if(p==='on-t'){e2.on.t=v;e2.on.v=v==='stage'?'Proposal':v==='stale'?'14':v==='health'?'40':'';}else if(p==='on-v')e2.on.v=v;else if(p==='cond-f'){e2.cond={f:v};if(v==='value'){e2.cond.op='gt';e2.cond.v='50000';}else if(v==='priority')e2.cond.v='high';}else if(p==='cond-v')e2.cond.v=v;else if(p==='act-t'){e2.act={t:v,v:v==='priority'?'high':v==='sequence'?SEQUENCES[0].k:''};}else if(p==='act-v')e2.act.v=v;renderApp();break;}
  case 'auto-save':{const e2=S.autoEdit;if(e2&&S.role==='admin'){const nm=document.getElementById('auto-name');if(nm&&nm.value!==undefined)e2.name=nm.value;if(!(e2.name||'').trim())e2.name='Untitled rule';if(e2.act.t==='task'||e2.act.t==='tag'){const av=document.getElementById('auto-actv');if(av&&av.value!==undefined)e2.act.v=av.value;}if((e2.act.t==='task')&&!(String(e2.act.v||'').trim()))e2.act.v='Follow up';if((e2.act.t==='tag')&&!(String(e2.act.v||'').trim()))e2.act.v='Flagged';delete e2._new;const i=(S.automations||[]).findIndex(x=>x.id===e2.id);if(i>=0)S.automations[i]=e2;else S.automations.push(e2);S.autoEdit=null;renderApp();toast('Automation saved');}break;}
  case 'bulkenroll':{const sq=SEQUENCES.find(s=>s.k===el.dataset.seq)||SEQUENCES[0];pushUndo();let nn=0;S.bulk.forEach(id=>{const d=S.deals.find(x=>x.id===id);if(!d)return;const already=(d.acts||[]).some(x=>x.type==='marketing'&&x.seq&&x.seq.k===sq.k);if(already)return;pushAct(d,{type:'marketing',who:'Nova',w:'now',subj:'Enrolled in '+sq.name,seq:sq,step:1,text:'Bulk-enrolled in '+sq.name});nn++;});S.ltMenu=null;renderApp();toast('Enrolled '+nn+' deal'+(nn!==1?'s':'')+' in '+sq.name);break;}
 }
}
document.addEventListener('click',e=>{if(S._dragEndAt&&Date.now()-S._dragEndAt<280)return;const el=e.target.closest('[data-act]');if(!el)return;clickDispatch(el,e);});
document.addEventListener('dblclick',e=>{const c=e.target.closest('.lcell.edit');if(c&&!c.querySelector('.cellin'))beginEdit(c);});
document.addEventListener('input',e=>{
 if(S.docB&&e.target.classList&&e.target.classList.contains('db-in')){docReadDOM();docTotalsDOM();return;}
 if(e.target.id==='q'){S.q=e.target.value;renderApp();const q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length);}catch(_){}}return;}
 if(e.target.id==='cmdq'){S.paletteQ=e.target.value;S.paletteSel=0;renderApp();const i=document.getElementById('cmdq');if(i){i.focus();try{i.setSelectionRange(i.value.length,i.value.length);}catch(_){}}return;}
 if(e.target.classList&&e.target.classList.contains('colq-in')){const k=e.target.dataset.k;S.colq[k]=e.target.value;renderApp();const i=document.getElementById('colq-'+k);if(i){i.focus();try{i.setSelectionRange(i.value.length,i.value.length);}catch(_){}}return;}
});
document.addEventListener('change',e=>{const adv=e.target.closest('[data-act="adv-set"]');if(adv){captureAdv();const i=+adv.dataset.i,part=adv.dataset.part,r=S.filters.adv.rules[i];if(!r)return;if(part==='f'){r.f=adv.value;const m=fmeta(r.f);r.op=defOp(m.type);r.v=defVal(r.f);}else r[part]=adv.value;renderApp();return;}const el=e.target.closest('[data-act]');if(el&&el===e.target&&(el.tagName==='SELECT'||el.tagName==='TEXTAREA'||el.tagName==='INPUT'))clickDispatch(el,e);});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();S.palette=true;S.paletteSel=0;S.paletteQ='';renderApp();const i=document.getElementById('cmdq');if(i&&i.focus)try{i.focus();}catch(_){}return;}
 if((e.metaKey||e.ctrlKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();if(e.shiftKey)doRedo();else doUndo();return;}
 if(S.palette){const items=paletteItems();if(e.key==='ArrowDown'){e.preventDefault();S.paletteSel=Math.min(items.length-1,(S.paletteSel||0)+1);renderApp();const i=document.getElementById('cmdq');if(i&&i.focus)try{i.focus();}catch(_){}}else if(e.key==='ArrowUp'){e.preventDefault();S.paletteSel=Math.max(0,(S.paletteSel||0)-1);renderApp();const i=document.getElementById('cmdq');if(i&&i.focus)try{i.focus();}catch(_){}}else if(e.key==='Enter'){e.preventDefault();const it=items[S.paletteSel||0];if(it){S.palette=false;it.run();renderApp();}}else if(e.key==='Escape'){S.palette=false;renderApp();}return;}
 if(S.pipeNew){const pin=document.getElementById('pipe-new-input');if(pin)S.pipeNewVal=pin.value;if(e.key==='Enter'){e.preventDefault();pipeCreate();return;}if(e.key==='Escape'){S.pipeNew=false;S.pipeNewVal='';renderApp();return;}}
 if(e.key==='Escape'){if(S.pipeManage){S.pipeManage=false;S.pipeNew=false;renderApp();}else if(S.pipeMenu){S.pipeMenu=false;S.pipeNew=false;renderApp();}else if(S.recordEdit){S.recordEdit=false;renderApp();}else if(S.logwid){const w=winById(S.logwid);if(w)closeWin(w);S.logwid=null;renderApp();}else if(S.hub){S.hub=false;renderApp();}else if(S.cardEdit){S.cardEdit=false;renderApp();}else if(S.composer){S.composer=null;renderApp();}else if(S.docB){S.docB=null;renderApp();}else if(S.capture){S.capture=null;renderApp();}else if(S.objMenu){S.objMenu=false;renderApp();}else if(S.objEdit){S.objEdit=false;renderApp();}else if(S.objId){S.objId=null;renderApp();}else if(S.autoEdit){S.autoEdit=null;renderApp();}else if(S.autoOpen){S.autoOpen=false;renderApp();}else if(S.tasksOpen){S.tasksOpen=false;renderApp();}else if(S.boardMenu){S.boardMenu=false;renderApp();}else if(S.swimMenu){S.swimMenu=false;renderApp();}else if(S.notifOpen){S.notifOpen=false;renderApp();}else if(S.drawer){S.drawer=null;renderApp();}else if(S.cardMenu){S.cardMenu=null;renderApp();}else if(S.colMenu){S.colMenu=null;renderApp();}else if(S.ltMenu||S.colPanel){S.ltMenu=null;S.colPanel=false;renderApp();}else if(S.logMenu){S.logMenu=false;renderApp();}else if(S.filters.panel){S.filters.panel=null;renderApp();}else if(S.openId){S.openId=null;renderApp();}return;}
 if(S.sel&&S.view==='list'&&!S.openId&&!document.querySelector('.cellin')){const rows=sortedList();let ri=rows.findIndex(r=>r.id===S.sel.id),ci=S.cols.indexOf(S.sel.k);if(ri<0)return;let mv=true;
  if(e.key==='ArrowDown')ri=Math.min(rows.length-1,ri+1);else if(e.key==='ArrowUp')ri=Math.max(0,ri-1);else if(e.key==='ArrowRight')ci=Math.min(S.cols.length-1,ci+1);else if(e.key==='ArrowLeft')ci=Math.max(0,ci-1);
  else if(e.key==='Enter'){const cell=document.querySelector('.lcell.sel');if(cell){e.preventDefault();beginEdit(cell);}return;}else mv=false;
  if(mv){e.preventDefault();S.sel={id:rows[ri].id,k:S.cols[ci]};renderApp();}}
});

/* ============ BOOT ============ */
renderApp();

</script>
